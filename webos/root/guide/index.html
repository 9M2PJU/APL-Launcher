<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Guide</title>
<!-- LG's Guide (com.webos.app.livemenu) on a rooted TV, mounted in RAM by apl-home.sh: a blank, transparent page.
     When the TV opens it, the launcher's service closes it and opens APL Launcher's Control Center (it sees the
     launch in the app manager's events). If the service isn't there, it closes itself after 2 seconds. -->
<style>html, body { margin: 0; height: 100%; background: transparent; }</style>
</head>
<body>
<script>
setTimeout(function () { window.close(); }, 2000);
document.addEventListener("webOSRelaunch", function () { setTimeout(function () { window.close(); }, 2000); });
</script>
</body>
</html>
