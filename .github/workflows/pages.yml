# Online demo: the launcher's PC preview, served by GitHub Pages.
# Only git-tracked files are published: no keys, no personal avatars.
name: Demo

on:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the launcher
        run: |
          mkdir _site
          cp -r launcher/. _site/
          # package signatures: only the screen needs them
          rm -f _site/author-signature.xml _site/signature1.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
