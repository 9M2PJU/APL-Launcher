name: Setup app

# Builds APL Launcher Setup.exe on every push; a v* tag also publishes it in a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: |
          .\installer\build.ps1
          Copy-Item "dist\APL Launcher Setup.exe" "dist\APL-Launcher-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: APL-Launcher-Setup
          path: dist/APL-Launcher-Setup.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/APL-Launcher-Setup.exe
          generate_release_notes: true
